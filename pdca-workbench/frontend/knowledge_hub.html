<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>经销商知识库 · PDCA</title>
  <style>
    :root{color-scheme:light;--ink:#17212b;--muted:#66727e;--line:#d5dce1;--panel:#eef1f3;--paper:#fff;--accent:#a51d2d;--accent2:#17674a;--focus:#1769aa;font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif}
    *{box-sizing:border-box;letter-spacing:0}body{margin:0;min-width:320px;min-height:100vh;background:#f5f6f7;color:var(--ink);font-size:14px;line-height:1.55}
    button,input,select,textarea{font:inherit;letter-spacing:0}button,select{cursor:pointer}:focus-visible{outline:3px solid #1769aa55;outline-offset:2px}
    .topbar{height:66px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;background:#20262c;color:#fff;border-bottom:3px solid var(--accent)}
    .brand{display:flex;align-items:center;gap:12px}.mark{width:34px;height:34px;display:grid;place-items:center;border:1px solid #87919a;border-radius:50%;font:19px Georgia,serif}.brand strong{font:18px Georgia,serif}.brand span{margin-left:8px;color:#c9d0d5;font-size:13px}
    .topbar nav{display:flex;gap:8px;align-items:center}.topbar a,.topbar button{color:#e4e8eb;background:transparent;border:1px solid #59636b;border-radius:5px;padding:8px 10px;text-decoration:none}.topbar button[hidden]{display:none}
    main{min-height:calc(100vh - 66px);display:grid;grid-template-columns:minmax(240px,280px) minmax(0,1fr)}
    aside{padding:28px 22px;background:var(--panel);border-right:1px solid var(--line)}.eyebrow{margin:0 0 5px;color:var(--accent);font-size:11px;font-weight:700;text-transform:uppercase}.scope-title{margin:0 0 24px;font-size:19px}
    label{display:grid;gap:7px;margin:0 0 19px;font-weight:650;font-size:13px}select,input,textarea{width:100%;border:1px solid #b8c1c8;border-radius:5px;background:#fff;color:var(--ink);padding:10px 11px}select,input{height:42px}textarea{min-height:92px;resize:vertical}
    .scope-meta{margin:-11px 0 22px;color:var(--muted);font-size:12px}.privacy{margin-top:28px;padding-top:18px;border-top:1px solid #c9d0d5;color:var(--muted);font-size:12px}.privacy strong{display:block;margin-bottom:5px;color:var(--ink)}
    .workspace{width:100%;max-width:1220px;padding:38px clamp(22px,4vw,58px) 60px}.workspace-head{display:flex;justify-content:space-between;align-items:end;gap:20px}.workspace-head h1{margin:0;font-size:26px}.workspace-head p{margin:4px 0 0;color:var(--muted)}
    .search{height:50px;margin-top:24px;display:grid;grid-template-columns:minmax(0,1fr) 92px}.search input{height:50px;border-radius:6px 0 0 6px;border-right:0;padding:0 15px}.search button,.primary{border:1px solid var(--accent);background:var(--accent);color:#fff;font-weight:700;border-radius:0 6px 6px 0}.search button:disabled,.primary:disabled{cursor:not-allowed;background:#9da6ad;border-color:#9da6ad}
    .notice{min-height:46px;margin-top:14px;padding:11px 13px;background:#eaf0f2;border-left:3px solid #7c8b96;color:var(--muted)}.notice.error{background:#f8ecee;border-color:var(--accent);color:#801725}.notice.ok{background:#e9f4ef;border-color:var(--accent2);color:#175d44}
    .results{margin-top:28px}.results-head{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line)}.results-head h2{margin:0 0 9px;font-size:16px}.results-head span{color:var(--muted);font-size:12px}.results ol{list-style:none;margin:0;padding:0}
    .result{display:grid;grid-template-columns:34px 160px minmax(0,1fr);gap:14px;padding:20px 0;border-bottom:1px solid var(--line)}.result.no-image{grid-template-columns:34px minmax(0,1fr)}.idx{width:29px;height:29px;display:grid;place-items:center;border-radius:4px;background:#313a42;color:#fff;font-size:11px;font-weight:700}.thumb{width:160px}.thumb img{display:block;width:160px;height:120px;object-fit:contain;background:#e3e7ea;border:1px solid var(--line);border-radius:4px}.thumb span{display:block;margin-top:5px;text-align:center;color:var(--muted);font-size:12px}.result article{min-width:0}.row-head{display:flex;align-items:start;justify-content:space-between;gap:14px}.row-head h3{margin:0;overflow-wrap:anywhere;font-size:15px}.score{flex:none;color:var(--accent2);font-size:12px}.excerpt{margin:8px 0 12px;white-space:pre-wrap;overflow-wrap:anywhere;color:#3d4852}.citation{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;margin-top:12px}.actions button,.actions a{border:1px solid #aeb7be;background:#fff;border-radius:5px;padding:7px 10px;color:var(--ink);text-decoration:none}.actions .danger{border-color:#c98f97;color:#871926}
    dialog{width:min(560px,calc(100% - 28px));border:1px solid var(--line);border-radius:7px;padding:0;background:#fff;color:var(--ink);box-shadow:0 22px 60px #0005}dialog::backdrop{background:#11182099}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:17px 20px;border-bottom:1px solid var(--line)}.modal-head h2{margin:0;font-size:18px}.close{width:34px;height:34px;border:0;background:transparent;font-size:24px;color:var(--muted)}.modal-body{padding:20px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.modal-actions button{height:40px;border-radius:5px;padding:0 15px}.secondary{border:1px solid #adb6bd;background:#fff}.modal-actions .primary{border-radius:5px}.progress{margin:12px 0 0;color:var(--muted);font-size:12px}
    .review-list{max-height:300px;overflow:auto;list-style:none;margin:12px 0 18px;padding:0;border-top:1px solid var(--line)}.review-item{padding:13px 0;border-bottom:1px solid var(--line)}.review-item strong{display:block;overflow-wrap:anywhere}.review-item p{margin:3px 0 9px;color:var(--muted);font-size:12px}.review-actions{display:flex;gap:8px}.review-actions button{border:1px solid #adb6bd;border-radius:5px;background:#fff;padding:6px 10px}.review-actions .reject{border-color:#c98f97;color:#871926}
    .visually-hidden{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
    [hidden]{display:none!important}
    @media(max-width:760px){.topbar{height:auto;min-height:64px;padding:11px 14px}.brand span{display:none}.topbar nav a{display:none}main{display:block}aside{padding:20px 16px;border-right:0;border-bottom:1px solid var(--line)}.privacy{display:none}.workspace{padding:25px 16px 44px}.workspace-head h1{font-size:21px}.result,.result.no-image{grid-template-columns:29px minmax(0,1fr);gap:10px}.thumb{grid-column:2;width:100%}.thumb img{width:100%;height:auto;aspect-ratio:4/3}.result article{grid-column:2}.search{grid-template-columns:minmax(0,1fr) 72px}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="mark">V</span><div><strong>VERTU</strong><span>经销商知识库</span></div></div>
    <nav><a href="/">返回 PDCA</a><button id="review-open" type="button" hidden>待审核</button><button id="upload-open" type="button" hidden>上传资料</button></nav>
  </header>
  <main>
    <aside>
      <p class="eyebrow">Knowledge scope</p><h2 class="scope-title">经销商资料查询</h2>
      <label>经销商<select id="dealer" disabled><option>正在载入...</option></select></label>
      <p id="scope-meta" class="scope-meta">正在读取账号权限</p>
      <label>资料分类<select id="category"><option value="">全部资料</option><option value="dealer_profile">经销商档案</option><option value="contract_compliance">合同与合规</option><option value="store_display">门店陈列</option><option value="product_policy">产品与政策</option><option value="sales_inventory">销售与库存</option><option value="marketing_training">市场与培训</option><option value="communications">沟通记录</option><option value="logistics_after_sales">物流与售后</option><option value="finance_settlement">财务结算</option><option value="media">图片与媒体</option></select></label>
      <div class="privacy"><strong>数据保护</strong>结果与预览默认脱敏；查询、上传和原件下载均记录审计。</div>
    </aside>
    <section class="workspace">
      <div class="workspace-head"><div><p class="eyebrow">Knowledge retrieval</p><h1>从经销商资料中查找证据</h1><p>文字、图片和视频结果均附带原始文件引用</p></div></div>
      <form id="search" class="search"><input id="query" type="search" maxlength="500" autocomplete="off" aria-describedby="selected-dealer" placeholder="输入经销商、活动、合同或库存问题" required><button id="search-btn" disabled>查询</button></form>
      <p id="selected-dealer" class="scope-meta">当前检索经销商：正在载入...</p>
      <div id="notice" class="notice" role="status" aria-live="polite">请选择经销商并输入问题。</div>
      <section id="results" class="results" hidden><div class="results-head"><h2>检索结果</h2><span id="count"></span></div><ol id="list"></ol></section>
    </section>
  </main>

  <dialog id="upload-dialog"><form id="upload-form"><div class="modal-head"><h2>上传经销商资料</h2><button class="close" type="button" data-close="upload-dialog" aria-label="关闭">×</button></div><div class="modal-body">
    <label>经销商<select id="upload-dealer" required></select></label><label>资料文件<input id="upload-file" type="file" required></label><label>资料标题<input id="upload-title" maxlength="500" required></label><label>资料分类<select id="upload-category" required><option value="dealer_profile">经销商档案</option><option value="contract_compliance">合同与合规</option><option value="store_display">门店陈列</option><option value="product_policy">产品与政策</option><option value="sales_inventory">销售与库存</option><option value="marketing_training">市场与培训</option><option value="communications">沟通记录</option><option value="logistics_after_sales">物流与售后</option><option value="finance_settlement">财务结算</option><option value="media">图片与媒体</option></select></label><label>敏感级别<select id="upload-sensitivity"><option value="internal">内部</option><option value="confidential">保密</option><option value="restricted">受限</option></select></label>
    <p id="upload-status" class="progress"></p><div class="modal-actions"><button class="secondary" type="button" data-close="upload-dialog">取消</button><button id="upload-btn" class="primary" type="submit">上传并处理</button></div></div>
  </form></dialog>

  <dialog id="review-dialog"><div class="modal-head"><h2>高敏感资料审核</h2><button class="close" type="button" data-close="review-dialog" aria-label="关闭">×</button></div><div class="modal-body">
    <p class="progress">命中密码、密钥、证件或受限标记的资料不会进入检索，需管理员决定。</p><ul id="review-list" class="review-list"></ul><label>审核原因<textarea id="review-reason" minlength="3" maxlength="500" placeholder="填写批准或拒绝原因"></textarea></label><p id="review-status" class="progress" role="status"></p>
  </div></dialog>

  <dialog id="export-dialog"><form id="export-form"><div class="modal-head"><h2>下载原件</h2><button class="close" type="button" data-close="export-dialog" aria-label="关闭">×</button></div><div class="modal-body">
    <input class="visually-hidden" type="text" autocomplete="username" tabindex="-1" aria-hidden="true"><label>管理员密码<input id="export-password" type="password" autocomplete="current-password" required></label><label>下载原因<textarea id="export-reason" minlength="10" maxlength="500" required></textarea></label>
    <p id="export-status" class="progress"></p><div class="modal-actions"><button class="secondary" type="button" data-close="export-dialog">取消</button><button id="export-btn" class="primary" type="submit">验证并下载</button></div></div>
  </form></dialog>

  <script>
    const $=s=>document.querySelector(s), API='/api/knowledge';
    const labels={dealer_profile:'经销商档案',contract_compliance:'合同与合规',store_display:'门店陈列',product_policy:'产品与政策',sales_inventory:'销售与库存',marketing_training:'市场与培训',communications:'沟通记录',logistics_after_sales:'物流与售后',finance_settlement:'财务结算',media:'图片与媒体',unclassified:'未分类'};
    const imagePattern=/\.(?:jpe?g|png|webp|heic)$/i; let scope=null, exportAsset='';
    function message(text,state=''){const n=$('#notice');n.textContent=text;n.className='notice '+state}
    async function json(url,options={}){const r=await fetch(url,{credentials:'include',...options});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||d.message||'请求失败');return d}
    function fillDealers(select,dealers){select.replaceChildren();dealers.forEach(d=>select.add(new Option(d.name,d.dealer_id)));}
    function selectedDealerName(){return $('#dealer').selectedOptions[0]?.textContent||'未选择';}
    function setSearchDealer(){ $('#selected-dealer').textContent=`当前检索经销商：${selectedDealerName()}`; }
    async function loadScope(){try{scope=await json(API+'/scope');if(!scope.enabled)throw new Error('知识库服务尚未启用');if(!scope.dealers.length)throw new Error('当前账号没有已绑定的经销商资料权限');fillDealers($('#dealer'),scope.dealers);fillDealers($('#upload-dealer'),scope.dealers);setSearchDealer();$('#dealer').disabled=false;$('#search-btn').disabled=false;$('#scope-meta').textContent=scope.scope==='all'?`${scope.dealers.length} 个经销商 · 全局范围`:`${scope.dealers.length} 个经销商 · 授权范围`;$('#upload-open').hidden=!scope.can_upload;$('#review-open').hidden=!scope.can_review_sensitive;$('#query').focus()}catch(e){$('#dealer').replaceChildren(new Option('无可用范围'));$('#selected-dealer').textContent='当前检索经销商：无可用范围';message(e.message,'error')}}
    function score(row){if(row.retrieval_kind==='image_semantic')return `画面匹配 ${Math.round((row.semantic_similarity||0)*100)}%`;if(row.lexical_score!==null&&row.lexical_score!==undefined)return '关键词命中';return `语义相似 ${Math.round((row.semantic_similarity||0)*100)}%`}
    function render(items){const list=$('#list');list.replaceChildren();items.forEach((row,i)=>{const c=row.citation||{},li=document.createElement('li');li.className='result';const image=imagePattern.test(c.original_name||'')?`<a class="thumb" href="${API}/assets/${encodeURIComponent(row.asset_id)}/content" target="_blank" rel="noopener"><img loading="lazy" src="${API}/assets/${encodeURIComponent(row.asset_id)}/content" alt="${escapeHtml(c.title||c.original_name||'资料预览')}"><span>查看脱敏预览</span></a>`:'';if(!image)li.classList.add('no-image');const exportButton=scope.can_export_original?`<button class="danger" data-export="${row.asset_id}">下载原件</button>`:'';li.innerHTML=`<span class="idx">${String(i+1).padStart(2,'0')}</span>${image}<article><div class="row-head"><h3>${escapeHtml(c.title||c.original_name||'未命名资料')}</h3><span class="score">${score(row)}</span></div><p class="excerpt">${escapeHtml((row.text||'该资料没有可显示文字。').slice(0,420))}</p><div class="citation"><span>文件 ${escapeHtml(c.original_name||'-')}</span><span>版本 v${c.version_number||1}</span><span>分类 ${escapeHtml(labels[row.category]||row.category||'-')}</span></div><div class="actions"><a href="${API}/assets/${encodeURIComponent(row.asset_id)}/content" target="_blank" rel="noopener">查看引用</a>${exportButton}</div></article>`;list.append(li)});$('#count').textContent=`${items.length} 条证据`;$('#results').hidden=false}
    function escapeHtml(v){const e=document.createElement('span');e.textContent=String(v??'');return e.innerHTML}
    $('#dealer').addEventListener('change',setSearchDealer);
    $('#search').addEventListener('submit',async e=>{e.preventDefault();const q=$('#query').value.trim();if(!q)return;const dealer=selectedDealerName();$('#search-btn').disabled=true;$('#results').hidden=true;message(`正在检索 ${dealer} 的已处理资料...`,'ok');try{const d=await json(API+'/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q,dealer_id:$('#dealer').value,category:$('#category').value||null,top_k:8})});if(!d.items?.length){message(`${dealer} 中无可靠证据。请调整关键词或资料分类。`,'error');return}render(d.items);message(`已在 ${dealer} 中找到相关证据，结果按相关性排序。`,'ok')}catch(err){message(err.message,'error')}finally{$('#search-btn').disabled=false}});
    function openExport(e){const b=e.target.closest('[data-export]');if(!b)return;exportAsset=b.dataset.export;$('#export-status').textContent='';$('#export-password').value='';$('#export-reason').value='';$('#export-dialog').showModal()}
    $('#list').addEventListener('click',openExport);$('#review-list').addEventListener('click',openExport);
    $('#export-form').addEventListener('submit',async e=>{e.preventDefault();const btn=$('#export-btn');btn.disabled=true;$('#export-status').textContent='正在验证管理员身份...';try{await json(API+'/reauth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#export-password').value})});const idem=crypto.randomUUID();const grant=await json(API+'/exports',{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':idem},body:JSON.stringify({asset_id:exportAsset,reason:$('#export-reason').value.trim(),confirmation:'export-original'})});$('#export-status').textContent='正在下载原件...';const r=await fetch(grant.download_url,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({export_token:grant.download_token})});if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.detail||'原件下载失败')}const blob=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);const cd=r.headers.get('content-disposition')||'';a.download=decodeURIComponent((cd.match(/filename\*=UTF-8''([^;]+)/)||[])[1]||'original-file');a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);$('#export-dialog').close();message('原件下载已记录审计。','ok')}catch(err){$('#export-status').textContent=err.message}finally{btn.disabled=false}});
    $('#upload-open').addEventListener('click',()=>{$('#upload-status').textContent='';$('#upload-dialog').showModal()});$('#upload-file').addEventListener('change',e=>{if(e.target.files[0])$('#upload-title').value=e.target.files[0].name.replace(/\.[^.]+$/,'')});
    $('#upload-form').addEventListener('submit',async e=>{e.preventDefault();const file=$('#upload-file').files[0],btn=$('#upload-btn');if(!file)return;btn.disabled=true;try{$('#upload-status').textContent='正在上传并校验文件...';const form=new FormData();form.set('dealer_id',$('#upload-dealer').value);form.set('title',$('#upload-title').value.trim());form.set('category',$('#upload-category').value);form.set('sensitivity',$('#upload-sensitivity').value);form.set('file',file);const r=await fetch(API+'/uploads',{method:'POST',credentials:'include',body:form});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||'上传失败');$('#upload-dialog').close();message('文件已入队，ETL 完成后可检索。','ok')}catch(err){$('#upload-status').textContent=err.message}finally{btn.disabled=false}});
    async function loadReviews(){const list=$('#review-list');list.replaceChildren();$('#review-status').textContent='正在读取待审核资料...';try{const rows=await json(API+'/reviews');if(!rows.length){$('#review-status').textContent='当前没有待审核资料。';return}rows.forEach(row=>{const item=document.createElement('li');item.className='review-item';const title=document.createElement('strong');title.textContent=row.title||'未命名资料';const meta=document.createElement('p');meta.textContent=`${(row.review_reasons||[]).join('、')||'高敏感内容'} · ${row.sensitivity||'-'} · v${row.version_number||1}`;const actions=document.createElement('div');actions.className='review-actions';actions.innerHTML=`<button type="button" data-export="${encodeURIComponent(row.asset_id)}">下载原件</button><button type="button" data-review="${encodeURIComponent(row.review_id)}" data-decision="approve">批准入库</button><button type="button" class="reject" data-review="${encodeURIComponent(row.review_id)}" data-decision="reject">拒绝入库</button>`;item.append(title,meta,actions);list.append(item)});$('#review-status').textContent=`${rows.length} 项待审核`;}catch(err){$('#review-status').textContent=err.message}}
    $('#review-open').addEventListener('click',()=>{$('#review-reason').value='';$('#review-dialog').showModal();loadReviews()});$('#review-list').addEventListener('click',async e=>{const button=e.target.closest('[data-review]');if(!button)return;const reason=$('#review-reason').value.trim();if(reason.length<3){$('#review-status').textContent='请先填写审核原因。';return}button.disabled=true;try{await json(`${API}/reviews/${button.dataset.review}/decision`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision:button.dataset.decision,reason})});$('#review-reason').value='';await loadReviews()}catch(err){$('#review-status').textContent=err.message}finally{button.disabled=false}});
    document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>document.getElementById(b.dataset.close).close()));loadScope();
  </script>
</body>
</html>
