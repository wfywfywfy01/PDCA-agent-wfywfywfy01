# PDCA 对内工作台 · Docker Compose
# 用法（在完整仓库内）：
#   cd /opt/PDCA-agent/pdca-workbench
#   docker compose up -d --build
#
# 会自动：
#   - 挂载 ../data_platform/data_role_pdca_mvp → /mvp（经营首页）
#   - 挂载仓库根 → /repo
#   - env.docker 仅含非敏感默认项；密钥和数据库连接从 .env/环境变量注入

services:
  pdca-app:
    build:
      context: ..
      dockerfile: pdca-workbench/Dockerfile
    image: ${PDCA_IMAGE:-pdca-workbench:local}
    container_name: pdca-workbench
    ports:
      # 公网由宿主机 Caddy/Nginx 反代；不把 Uvicorn 直接暴露到外网。
      - "127.0.0.1:${PDCA_HOST_PORT:-8768}:8767"
    env_file:
      - path: env.docker
        required: true
      - path: .env
        required: false
    environment:
      TZ: Asia/Shanghai
      PDCA_ENV: production
      PDCA_SECRET_KEY: ${PDCA_SECRET_KEY:?请在未跟踪的 .env 中设置 PDCA_SECRET_KEY}
      PDCA_DATABASE_URL: ${PDCA_DATABASE_URL:?请在未跟踪的 .env 中设置 PDCA_DATABASE_URL}
      PDCA_HOST: "0.0.0.0"
      PDCA_WORKBENCH_PORT: "8767"
      # 强制容器内路径，避免宿主机 Windows 路径写进 .env 导致首页不可用
      PDCA_MVP_ROOT: /mvp
      PDCA_REPO_ROOT: /repo
      PDCA_AUTH_MODE: ${PDCA_AUTH_MODE:-hybrid}
      PDCA_SECURE_COOKIES: ${PDCA_SECURE_COOKIES:-1}
      PDCA_ACQUISITION_ENABLED: ${PDCA_ACQUISITION_ENABLED:-1}
      PDCA_ACQUISITION_URL: ${PDCA_ACQUISITION_URL:-https://global-autoleads.vertu.cn}
      PDCA_REQUIRE_VERTU: "1"
      PDCA_KNOWLEDGE_HUB_ENABLED: ${PDCA_KNOWLEDGE_HUB_ENABLED:-1}
      PDCA_KNOWLEDGE_HUB_URL: ${PDCA_KNOWLEDGE_HUB_URL:-https://dealer-knowledge.vertu.cn}
      PDCA_KNOWLEDGE_HUB_TOKEN_KEY_FILE: /run/secrets/dealer-knowledge-jwt.key
      PDCA_KNOWLEDGE_HUB_TEAM_MAP: ${PDCA_KNOWLEDGE_HUB_TEAM_MAP:-{"overseas":"overseas-sales"}}
      VERTU_COMMAND: vertu-cli
      VERTU_VPS_SERVICE_URL: ${VERTU_VPS_SERVICE_URL:-https://vps-service.vertu.cn}
      VERTU_APP_ID: ${VERTU_APP_ID:-cursor}
      VERTU_APP_KEY: ${VERTU_APP_KEY:?请在未跟踪的 .env 中设置 VERTU_APP_KEY}
      VERTU_USER_LOGIN: ${VERTU_USER_LOGIN:?请在未跟踪的 .env 中设置 VERTU_USER_LOGIN}
      VERTU_LEGACY_COMMAND: ${VERTU_LEGACY_COMMAND:-vertu}
      VERTU_BOT_INBOUND_KEY: ${VERTU_BOT_INBOUND_KEY:-}
      LOGIBOT_ENABLED: ${LOGIBOT_ENABLED:-0}
      LOGIBOT_ROOT: /app/logibot
      LOGIBOT_DATA_DIR: /app/data/logibot
      PDCA_VPS_BOT_APP_ID: ${PDCA_VPS_BOT_APP_ID:-}
      PDCA_VPS_BOT_APP_SECRET: ${PDCA_VPS_BOT_APP_SECRET:-}
      PDCA_VPS_BOT_CHANNEL_ID: ${PDCA_VPS_BOT_CHANNEL_ID:-}
      PDCA_DUZHAN_ENABLED: ${PDCA_DUZHAN_ENABLED:-0}
      PDCA_DUZHAN_BOT_APP_ID: ${PDCA_DUZHAN_BOT_APP_ID:-}
      PDCA_DUZHAN_BOT_APP_SECRET: ${PDCA_DUZHAN_BOT_APP_SECRET:-}
      PDCA_DUZHAN_TIMES: ${PDCA_DUZHAN_TIMES:-10:00,15:00,20:00}
      PDCA_DUZHAN_LEAD_MINUTES: ${PDCA_DUZHAN_LEAD_MINUTES:-15}
      PDCA_DUZHAN_REPLY_ENABLED: ${PDCA_DUZHAN_REPLY_ENABLED:-1}
      PDCA_AISALES_MCP_URL: ${PDCA_AISALES_MCP_URL:-https://aisales-report.vertu.cn/mcp}
      PDCA_AISALES_MCP_TOKEN: ${PDCA_AISALES_MCP_TOKEN:-}
      PDCA_VEMORY_DEPT_IDS: ${PDCA_VEMORY_DEPT_IDS:-2231,2227,2223,2230}
      PDCA_VEMORY_PAGE_SIZE: ${PDCA_VEMORY_PAGE_SIZE:-50}
      PDCA_VEMORY_MAX_PAGES: ${PDCA_VEMORY_MAX_PAGES:-20}
      PDCA_DUZHAN_AGENT_IM_HTML: ${PDCA_DUZHAN_AGENT_IM_HTML:-}
      PDCA_ALERT_BOT_CHANNEL_ID: ${PDCA_ALERT_BOT_CHANNEL_ID:-}
      # 多智能体督战运行时（全部默认关闭/影子，见 .env.example）
      PDCA_AGENT_ENABLED: ${PDCA_AGENT_ENABLED:-0}
      PDCA_AGENT_SHADOW_MODE: ${PDCA_AGENT_SHADOW_MODE:-1}
      PDCA_AGENT_OUTBOX_ENABLED: ${PDCA_AGENT_OUTBOX_ENABLED:-0}
      PDCA_AGENT_AUTO_TEMPLATE_PUSH: ${PDCA_AGENT_AUTO_TEMPLATE_PUSH:-0}
      PDCA_AGENT_TASK_WRITE: ${PDCA_AGENT_TASK_WRITE:-0}
      PDCA_AGENT_LLM_DRAFT: ${PDCA_AGENT_LLM_DRAFT:-0}
      PDCA_AGENT_HEALTHCHECK_ENABLED: ${PDCA_AGENT_HEALTHCHECK_ENABLED:-1}
      PDCA_AGENT_HEALTHCHECK_DELAY_MINUTES: ${PDCA_AGENT_HEALTHCHECK_DELAY_MINUTES:-5}
      PDCA_SUPERVISOR_ENABLED: ${PDCA_SUPERVISOR_ENABLED:-0}
      PDCA_SUPERVISOR_PROVIDER: ${PDCA_SUPERVISOR_PROVIDER:-}
      PDCA_SUPERVISOR_MODEL: ${PDCA_SUPERVISOR_MODEL:-}
      PDCA_SUPERVISOR_API_KEY: ${PDCA_SUPERVISOR_API_KEY:-}
      PDCA_SUPERVISOR_TIMEOUT_SECONDS: ${PDCA_SUPERVISOR_TIMEOUT_SECONDS:-90}
      PDCA_SUPERVISOR_MAX_TOOL_CALLS: ${PDCA_SUPERVISOR_MAX_TOOL_CALLS:-12}
      PDCA_QWEN_BASE_URL: ${PDCA_QWEN_BASE_URL:-https://qwen3.vertu.cn:8443}
      PDCA_QWEN_API_KEY: ${PDCA_QWEN_API_KEY:-}
      PDCA_QWEN_MODEL: ${PDCA_QWEN_MODEL:-qwen3.8-27b}
      PDCA_ASR_ENABLED: ${PDCA_ASR_ENABLED:-0}
      PDCA_ASR_PROVIDER: ${PDCA_ASR_PROVIDER:-doubao}
      PDCA_DOUBAO_ASR_URL: ${PDCA_DOUBAO_ASR_URL:-https://openspeech.bytedance.com/api/v3/auc/bigmodel/recognize/flash}
      PDCA_DOUBAO_ASR_APP_KEY: ${PDCA_DOUBAO_ASR_APP_KEY:-}
      PDCA_DOUBAO_ASR_ACCESS_KEY: ${PDCA_DOUBAO_ASR_ACCESS_KEY:-}
      PDCA_DOUBAO_ASR_API_KEY: ${PDCA_DOUBAO_ASR_API_KEY:-}
      PDCA_DOUBAO_ASR_RESOURCE_ID: ${PDCA_DOUBAO_ASR_RESOURCE_ID:-volc.bigasr.auc_turbo}
      PDCA_DOUBAO_ASR_TIMEOUT_SECONDS: ${PDCA_DOUBAO_ASR_TIMEOUT_SECONDS:-180}
      PDCA_DOUBAO_ASR_MODE: ${PDCA_DOUBAO_ASR_MODE:-fallback}
      PDCA_MTO_VISION_ENABLED: ${PDCA_MTO_VISION_ENABLED:-1}
      PDCA_TODO_SCORING_ENABLED: ${PDCA_TODO_SCORING_ENABLED:-0}
      PDCA_TODO_LEDGER_SYNC_ENABLED: ${PDCA_TODO_LEDGER_SYNC_ENABLED:-0}
    volumes:
      - ./data:/app/data
      # Persist legacy `vertu login` sessions when Bot Key authentication is not used.
      - pdca-vertu-session:/root/.vertu
      - ../data_platform/data_role_pdca_mvp:/mvp:ro
      - ./data/runtime/inputs:/mvp/inputs
      - ./data/runtime/outputs:/mvp/outputs
      - ./data/runtime/outbox:/mvp/outbox
      - ../:/repo:ro
      - ${PDCA_KNOWLEDGE_HUB_TOKEN_KEY_FILE_HOST:-./secrets/dealer-knowledge-jwt.key}:/run/secrets/dealer-knowledge-jwt.key:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8767/health'))['status'] == 'ok'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - pdca-net

  nginx:
    image: nginx:alpine
    container_name: pdca-nginx
    # 线上已有 Caddy 时不启动；仅无宿主机反代时显式加 --profile bundled-proxy。
    profiles: ["bundled-proxy"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 若有证书可取消注释：
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      pdca-app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pdca-net

networks:
  pdca-net:
    driver: bridge

volumes:
  pdca-vertu-session:
