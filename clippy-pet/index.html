<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Clippy 桌宠</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
      }
      #pet {
        position: absolute;
        left: 0;
        top: 0;
        z-index: 10;
        cursor: grab;
      }
      #pet:active {
        cursor: grabbing;
      }
      /* clippyjs balloon */
      .clippy-balloon {
        position: fixed;
        z-index: 1000;
        background: #ffffe1;
        color: #000;
        border: 1px solid #4a4a4a;
        border-radius: 8px;
        padding: 8px 11px;
        font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
        font-size: 13px;
        line-height: 1.55;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
        word-break: break-word;
      }
      .clippy-content {
        max-width: 250px;
      }
      .clippy-tip {
        position: absolute;
        width: 12px;
        height: 12px;
        background: #ffffe1;
        border-right: 1px solid #4a4a4a;
        border-bottom: 1px solid #4a4a4a;
      }
    </style>
  </head>
  <body>
    <script type="module" src="./renderer.js"></script>
  </body>
</html>
