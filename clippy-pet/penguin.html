<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>QQ 企鹅桌宠</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
      }
      #penguin {
        position: absolute;
        left: 0;
        top: 0;
        z-index: 10;
        cursor: grab;
      }
      #penguin:active {
        cursor: grabbing;
      }
      /* 气泡：跟 Clippy 那只保持同一套视觉 */
      .clippy-balloon {
        position: fixed;
        z-index: 1000;
        background: #ffffe1;
        color: #000;
        border: 1px solid #4a4a4a;
        border-radius: 8px;
        padding: 8px 11px;
        font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
        font-size: 13px;
        line-height: 1.55;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
        word-break: break-word;
        white-space: pre-line;
        max-width: 250px;
        display: none;
      }
      .clippy-balloon .tip {
        position: absolute;
        width: 12px;
        height: 12px;
        background: #ffffe1;
        border-right: 1px solid #4a4a4a;
        border-bottom: 1px solid #4a4a4a;
      }
      /* 养成状态面板 */
      #panel {
        position: fixed;
        z-index: 1200;
        width: 166px;
        background: #fffdf3;
        border: 1px solid #4a4a4a;
        border-radius: 10px;
        padding: 9px 11px 10px;
        font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
        font-size: 12px;
        color: #23252c;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.28);
        display: none;
      }
      #panel h4 {
        margin: 0 0 6px;
        font-size: 13px;
      }
      #panel .row {
        display: flex;
        align-items: center;
        margin: 3px 0;
      }
      #panel .row span {
        width: 44px;
        color: #5b5f6b;
      }
      #panel .bar {
        flex: 1;
        height: 9px;
        background: #e7e5da;
        border-radius: 5px;
        overflow: hidden;
      }
      #panel .bar i {
        display: block;
        height: 100%;
        border-radius: 5px;
        transition: width 0.25s;
      }
      #panel .foot {
        margin-top: 7px;
        color: #5b5f6b;
        font-size: 11px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <canvas id="penguin" width="140" height="140"></canvas>
    <div class="clippy-balloon" id="balloon"><span id="btext"></span></div>
    <div id="panel"></div>
    <script type="module" src="./penguin/penguin.js"></script>
  </body>
</html>
